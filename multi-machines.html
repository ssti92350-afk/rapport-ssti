<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapports par machine — SSTI</title></head><body><p id="loading">Chargement du rapport…</p><script>
fetch('index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.text()}).then(html=>{const at=html.lastIndexOf('</body>');if(at<0)throw new Error();html=html.slice(0,at)+'<script src="multi-machines.js?v=1"><\/script>'+html.slice(at);document.open();document.write(html);document.close()}).catch(()=>{document.getElementById('loading').textContent='Le rapport est indisponible. Rechargez la page.'});
